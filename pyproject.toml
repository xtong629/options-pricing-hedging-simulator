[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionlab-analytics"
version = "1.0.0rc1"
description = "European option pricing and numerical validation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

readme = "README.md"

[project.scripts]
optionlab = "optionlab.cli:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
